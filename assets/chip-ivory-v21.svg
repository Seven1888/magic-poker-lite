<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
<!-- Original clay-composite poker chip: continuous edge inserts, recessed inlay, matte surface and a low table perspective. No printed denomination. -->
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eee4cf"/><stop offset=".22" stop-color="#d2c8af"/><stop offset=".7" stop-color="#797666"/><stop offset="1" stop-color="#101619"/></linearGradient>
 <linearGradient id="face" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#eee4cf"/><stop offset=".48" stop-color="#d2c8af"/><stop offset="1" stop-color="#797666"/></linearGradient>
 <linearGradient id="inlay" x1=".15" y1="0" x2=".75" y2="1"><stop stop-color="#f1ebdb"/><stop offset=".58" stop-color="#ddd3bd"/><stop offset="1" stop-color="#b3ab98"/></linearGradient>
 <linearGradient id="edgeInsert" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ded7c5"/><stop offset="1" stop-color="#797d76"/></linearGradient>
 <radialGradient id="shadow"><stop stop-color="#070d12" stop-opacity=".62"/><stop offset="1" stop-color="#070d12" stop-opacity="0"/></radialGradient>
 <clipPath id="faceClip"><circle cx="80" cy="80" r="72"/></clipPath>
 <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence baseFrequency=".64" numOctaves="2" seed="14" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter>
</defs>
