<!-- Original denomination-free clay casino chip. The same edge insert angles continue over the top and side. -->
<defs>
  <linearGradient id="body" x1="0" y1="0" x2=".8" y2="1">
    <stop stop-color="#567582"/><stop offset=".5" stop-color="#385a6a"/><stop offset="1" stop-color="#284756"/>
  </linearGradient>
  <linearGradient id="edge-blue" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#4a6570"/><stop offset=".32" stop-color="#304c59"/><stop offset=".8" stop-color="#253e49"/><stop offset="1" stop-color="#1b2c35"/>
  </linearGradient>
  <linearGradient id="ivory" x1=".15" y1="0" x2=".75" y2="1">
    <stop stop-color="#e6ddbf"/><stop offset=".55" stop-color="#d8ccaa"/><stop offset="1" stop-color="#b9aa84"/>
  </linearGradient>
  <linearGradient id="edge-ivory" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#c7ba97"/><stop offset=".58" stop-color="#a79979"/><stop offset="1" stop-color="#766d54"/>
  </linearGradient>
  <radialGradient id="contact">
    <stop stop-color="#0e0909" stop-opacity=".68"/><stop offset=".58" stop-color="#140b0b" stop-opacity=".35"/><stop offset="1" stop-color="#140b0b" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grain" width="11" height="9" patternUnits="userSpaceOnUse">
    <path d="M1 2h.6M7 1h.45M4 6h.5M9 7h.65" stroke="#fff8e5" stroke-opacity=".2" stroke-width=".7"/>
    <path d="M4 1h.4M9 4h.5M1 7h.5M6 8h.4" stroke="#172d36" stroke-opacity=".21" stroke-width=".65"/>
  </pattern>
  <pattern id="edge-grain" width="4" height="5" patternUnits="userSpaceOnUse">
    <path d="M1 0v2M3 3v1" stroke="#c3b89a" stroke-opacity=".12" stroke-width=".6"/>
  </pattern>
  <clipPath id="face"><circle cx="80" cy="80" r="71.5"/></clipPath>
  <clipPath id="side"><path d="M8 42A72 31 0 0 0 152 42V56A72 31 0 0 1 8 56Z"/></clipPath>
</defs>
